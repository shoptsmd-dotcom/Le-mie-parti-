<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Aggiornamento CIAO Tiziano</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#202124}main{max-width:360px;padding:28px;text-align:center}.dot{width:42px;height:42px;border-radius:50%;background:#1a73e8;margin:0 auto 18px;animation:p 1s infinite alternate}@keyframes p{to{transform:scale(.8);opacity:.5}}h1{font-size:24px;margin:0 0 10px}p{color:#5f6368;line-height:1.45}</style></head>
<body><main><div class="dot"></div><h1>Aggiornamento V34</h1><p>Sto eliminando solo la vecchia cache dell’app. I dati salvati restano nel telefono.</p></main>
<script>
(async()=>{
 try{
  if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}
  if('caches' in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}
 }catch(e){}
 const u=new URL('./app-v34.html',location.href);u.searchParams.set('build','20260921-1734-'+Date.now());
 location.replace(u.href);
})();
</script></body></html>
